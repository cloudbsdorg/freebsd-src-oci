#
# ocifbsd.conf -- boot-time container definitions for the ocifbsd(8) runtime.
#
# This file is sourced by the ocifbsd rc.d(8) script (as /bin/sh) when
# ocifbsd_enable="YES" is set in rc.conf(5).  It is an alternative to placing
# the same ocifbsd_* variables directly in rc.conf.  See ocifbsd.conf(5).
#
# Nothing here takes effect unless ocifbsd_enable="YES" and the container
# names are listed in ocifbsd_containers below.
#

# Space-separated list of container names to create and start at boot, and
# to stop (in reverse order) at shutdown.
#ocifbsd_containers="web db"

# For each name N in ocifbsd_containers, define its source with exactly one
# of ocifbsd_N_image or ocifbsd_N_bundle, plus optional extra run arguments:
#
#   ocifbsd_N_image     an OCI image reference; pulled automatically if it is
#                       not already present in the local image store.
#   ocifbsd_N_bundle    path to a local OCI bundle directory (used only when
#                       ocifbsd_N_image is unset).
#   ocifbsd_N_args      extra arguments appended to the `ocifbsd run` command.
#
# Example (commented out):
#
#ocifbsd_web_image="docker.io/library/nginx:latest"
#ocifbsd_db_bundle="/var/lib/ocifbsd/bundles/db"
#ocifbsd_db_args=""
