#
# registries.conf -- registry alias table for the ocifbsd(8) runtime.
#
# Maps a registry reference name (the host portion of an image reference, e.g.
# "docker.io" in "docker.io/library/nginx") to the concrete API host and token
# endpoint used to reach it, and decides whether plain HTTP is permitted.
#
# Install this file at one of (searched in order; first found wins):
#   $OCIFBSD_REGISTRIES_CONF
#   /usr/local/etc/ocifbsd/registries.conf
#   /etc/ocifbsd/registries.conf
#
# ocifbsd ships with built-in defaults for Docker Hub, so pulls work without
# this file. Entries here override and extend those defaults.
#
# Format: one registry per line, whitespace-separated columns. Blank lines and
# lines beginning with '#' are ignored. Use '-' for an absent optional field.
#
#   name            api_host              auth_realm                     auth_service         tls
#
#   name          the registry as written in image references
#   api_host      the host actually contacted for the /v2/ API
#   auth_realm    token endpoint URL, used when the registry challenges
#                 without a WWW-Authenticate header ('-' if none)
#   auth_service  token "service" parameter ('-' if none)
#   tls           transport policy (optional, default "https"):
#                   https | secure | tls | false   -> require TLS (default)
#                   http  | insecure | true        -> permit plain HTTP
#
# Transport policy follows the Docker/Podman model: TLS is required by default.
# localhost (localhost, *.localhost, 127.0.0.0/8, ::1) is treated as insecure
# automatically and needs no entry here; add one only to force TLS on it.
#
# A "default-registry" directive sets the registry used for unqualified image
# references (a short name like "nginx" with no registry host). It defaults to
# docker.io.
#
#   default-registry   registry.example.com

# --- Built-in defaults (shown for reference; uncomment to customize) --------
#docker.io         registry-1.docker.io  https://auth.docker.io/token   registry.docker.io   https
#index.docker.io   registry-1.docker.io  https://auth.docker.io/token   registry.docker.io   https

# --- Examples ---------------------------------------------------------------

# A private registry reachable over HTTPS with anonymous or token auth.
#registry.example.com   registry.example.com   https://registry.example.com/token   registry.example.com   https

# An internal mirror served over plain HTTP (insecure -- use only on a trusted
# network).
#mirror.internal        mirror.internal        -   -   http

# Redirect Docker Hub pulls to an internal pull-through mirror.
#docker.io              hub-mirror.internal    -   -   https

# A registry running on the local host for development (http is already the
# default for localhost; shown for completeness).
#localhost:5000         localhost:5000         -   -   http
