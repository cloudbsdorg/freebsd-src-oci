# $FreeBSD$
#
# ocifbsd configuration file
#
# This is the configuration file for the FreeBSD Native OCI Runtime (ocifbsd).
# Copy this file to /etc/ocifbsd/ocifbsd.conf and edit as needed.

# Default runtime settings
ocifbsd_enable="NO"
ocifbsd_flags=""

# Storage configuration
ocifbsd_zfs_pool="zroot"
ocifbsd_data_dir="/var/lib/ocifbsd"
ocifbsd_state_dir="/var/run/ocifbsd"

# Networking configuration
ocifbsd_network_driver="bridge"
ocifbsd_bridge_name="ocifbsd0"
ocifbsd_default_subnet="10.0.0.0/24"
ocifbsd_default_gateway="10.0.0.1"

# Registry settings
ocifbsd_default_registry="docker.io"
ocifbsd_registry_ca_dir="/etc/ssl/certs"

# Logging configuration
ocifbsd_log_dir="/var/log/ocifbsd"
ocifbsd_log_level="info"
ocifbsd_log_to_syslog="YES"

# Resource limits defaults
ocifbsd_default_memory_limit="512M"
ocifbsd_default_cpu_shares="1024"
ocifbsd_default_proc_limit="1024"

# Security settings
ocifbsd_default_security="default"
ocifbsd_selinux_enabled="NO"
ocifbsd_apparmor_enabled="NO"

# Container defaults
ocifbsd_default_network="bridge"
ocifbsd_default_dns="8.8.8.8"
ocifbsd_pull_timeout="300"

# Cluster settings (for multi-node)
ocifbsd_cluster_enable="NO"
ocifbsd_cluster_interface="vtnet0"
ocifbsd_cluster_port="2377"
