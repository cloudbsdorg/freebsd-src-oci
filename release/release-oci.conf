#!/bin/sh
#
# Release configuration for FreeBSD OCI container tooling
# Focus: OCI container images for FreeBSD
#

## Target architecture
TARGET="amd64"
TARGET_ARCH="amd64"
KERNEL="GENERIC"

## Build parallelism
WORLD_FLAGS="-j$(sysctl -n hw.ncpu)"
KERNEL_FLAGS="-j$(( $(sysctl -n hw.ncpu) / 2 + 1 ))"

## Skip unnecessary components for faster builds
NOPORTS="1"
NOSRC="1"
NOPKGBASE="1"

## Build OCI container images (primary focus)
WITH_OCIIMAGES="1"

## Skip VM and cloud images for initial testing
# WITH_VMIMAGES="1"
# WITH_CLOUDWARE="1"

## Skip DVD to save time
# WITH_DVD="1"

## Skip compression for faster builds
# WITH_COMPRESSED_IMAGES="1"

## Skip git operations (using existing source)
NOGIT="1"

## Skip chroot checkout/update (using existing source)
SRC_UPDATE_SKIP="1"
# PORTS_UPDATE_SKIP="1"

## Custom make.conf and src.conf
MAKE_CONF="/dev/null"
SRC_CONF="/dev/null"
